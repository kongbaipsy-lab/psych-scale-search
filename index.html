const q=document.getElementById('q'),method=document.getElementById('method'),discipline=document.getElementById('discipline'),results=document.getElementById('results'),count=document.getElementById('count');
[...new Set(DATA.map(x=>x['学科']).filter(Boolean))].sort().forEach(x=>{let o=document.createElement('option');o.textContent=x;o.value=x;discipline.appendChild(o);});
function norm(s){return String(s??'').toLowerCase().replace(/\s+/g,'').replace(/[（）()－—_]/g,'-')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function matchRecord(r,term){if(!term)return true;const tokens=term.trim().split(/\s+/).filter(Boolean).map(norm);const hay=norm(Object.values(r).join(' '));return tokens.every(t=>hay.includes(t));}
function render(){
 const list=DATA.filter(r=>matchRecord(r,q.value)&&(!method.value||r['测评方式']===method.value)&&(!discipline.value||r['学科']===discipline.value));
 count.textContent=`找到 ${list.length} 项 · 数据库共 ${DATA.length} 项`;
 if(!list.length){results.innerHTML='<div class="empty">没有找到匹配项目，请尝试更短的关键词，例如“抑郁”“认知”“儿童”。</div>';return}

}
q.addEventListener('input',render);method.addEventListener('change',render);discipline.addEventListener('change',render);
document.getElementById('clear').onclick=()=>{q.value='';method.value='';discipline.value='';q.focus();render()};render();

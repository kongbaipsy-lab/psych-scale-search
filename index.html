.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{

.title{font-size:22px;line-height:1.45;font-weight:800;margin:0 0 8px}
.code{

.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}

.info{
  border-top:1px solid #edf0f2;padding-top:12px;
  display:grid;grid-template-columns:96px 1fr;gap:8px 10px;
  font-size:18px;line-height:1.55

.k{color:var(--muted)}
.empty{

.note{

@media(min-width:760px){

  .code{font-size:17px}
  .tag{font-size:16px}

[...new Set(DATA.map(x=>x['学科']).filter(x=>x&&x!=='海斯曼目录'))].sort().forEach(x=>{
  let o=document.createElement('option');o.textContent=x;o.value=x;discipline.appendChild(o);
});

  let o=document.createElement('option');o.textContent=x;o.value=x;hsmcat.appendChild(o);
});

function norm(s){return String(s??'').toLowerCase().replace(/\s+/g,'').replace(/[（）()－—_]/g,'-')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function matchRecord(r,term){
  if(!term)return true;
  const tokens=term.trim().split(/\s+/).filter(Boolean).map(norm);
  const hay=norm([
    r['项目名称'],r['简称'],r['编号'],r['海斯曼名称'],r['海斯曼简称'],
    r['参考分类'],r['关键词']
  ].join(' '));
  return tokens.every(t=>hay.includes(t));
}

function sourceBlock(r){
  if(r['来源']==='院内目录 + 海斯曼目录'){
    return `<div class="info">
      <div class="k">院内原始名称</div><div>${esc(r['院内原始名称'])}</div>
      <div class="k">海斯曼原始名称</div><div>${esc(r['海斯曼原始名称'])}</div>
      ${r['院内原始简称']?`<div class="k">院内简称</div><div>${esc(r['院内原始简称'])}</div>`:''}
      ${r['海斯曼原始简称']?`<div class="k">海斯曼简称</div><div>${esc(r['海斯曼原始简称'])}</div>`:''}
    </div>`;
  }
  if(r['来源']==='海斯曼目录'){
    return `<div class="info">
      <div class="k">海斯曼原始名称</div><div>${esc(r['海斯曼原始名称'])}</div>
      ${r['海斯曼原始简称']?`<div class="k">海斯曼简称</div><div>${esc(r['海斯曼原始简称'])}</div>`:''}
      <div class="k">院内对应</div><div>未找到明确对应项目</div>
    </div>`;
  }
  return `<div class="info">
    <div class="k">院内原始名称</div><div>${esc(r['院内原始名称'])}</div>
    ${r['院内原始简称']?`<div class="k">院内简称</div><div>${esc(r['院内原始简称'])}</div>`:''}
  </div>`;
}

   (!method.value||r['测评方式']===method.value) &&
   (!discipline.value||r['学科']===discipline.value) &&
   (!hsmcat.value||r['参考分类']===hsmcat.value)
 );
 count.textContent=`找到 ${list.length} 项 · 数据库共 ${DATA.length} 项`;

   results.innerHTML='<div class="empty">没有找到匹配项目，请尝试量表名称、简称或编号。</div>';

 }

   <div class="code">${r['来源']==='海斯曼目录'
      ? `来源：海斯曼A4目录`

     ${r['测评方式']?`<span class="tag">${esc(r['测评方式'])}</span>`:''}

     ${r['参考费用']!==''&&r['参考费用']!==null?`<div class="k">海斯曼费用</div><div>${esc(r['参考费用'])} 元</div>`:''}

     ${r['版本提示']?`<div class="k">差异提示</div><div>${esc(r['版本提示'])}</div>`:''}
     ${r['使用提示']?`<div class="k">使用提示</div><div>⚠️ ${esc(r['使用提示'])}</div>`:''}
   </div>
 </div>`).join('');
}

discipline.addEventListener('change',render);

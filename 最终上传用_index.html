}
.search{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}
.search input{grid-column:1/-1}
input,select,button{font:inherit}
input{

select{

}
button{
  min-height:54px;border:0;border-radius:13px;padding:11px 17px;

}
.meta{
  display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;
  margin:18px 3px 11px;color:var(--muted);font-size:17px;line-height:1.5
}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:17px;

}
.title{font-size:22px;line-height:1.45;font-weight:800;margin:0 0 8px}
.code{

  font-variant-numeric:tabular-nums
}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.tag{
  display:inline-flex;align-items:center;background:var(--primary-soft);
  color:#315f70;border-radius:8px;padding:5px 9px;font-size:16px;font-weight:600
}
.info{
  border-top:1px solid #edf0f2;padding-top:12px;
  display:grid;grid-template-columns:96px 1fr;gap:8px 10px;
  font-size:18px;line-height:1.55
}
.k{color:var(--muted)}
.empty{
  background:#fff;border:1px dashed #c7d1d9;border-radius:17px;
  padding:42px 20px;text-align:center;color:var(--muted);font-size:19px;line-height:1.6
}
.note{
  margin:20px 4px 0;padding-top:14px;border-top:1px solid var(--line);
  color:#77838d;font-size:15px;line-height:1.65
}
@media(min-width:760px){
  .wrap{padding-left:24px;padding-right:24px}
  .hero{margin-left:-24px;margin-right:-24px;padding-left:30px;padding-right:30px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:430px){
  .wrap{padding-left:14px;padding-right:14px}

  h1{font-size:29px}
  .sub{font-size:17px}
  .panel{padding:14px}
  .search{grid-template-columns:1fr 1fr}
  .search button{grid-column:1/-1}
  input{font-size:20px;min-height:58px}
  select,button{font-size:18px}
  .title{font-size:21px}
  .code{font-size:17px}
  .tag{font-size:16px}
  .info{font-size:18px}
}
</style>

</head>

function norm(s){return String(s??'').toLowerCase().replace(/\s+/g,'').replace(/[（）()－—_]/g,'-')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function matchRecord(r,term){if(!term)return true;const tokens=term.trim().split(/\s+/).filter(Boolean).map(norm);const hay=norm(Object.values(r).join(' '));return tokens.every(t=>hay.includes(t));}
function render(){
 const list=DATA.filter(r=>matchRecord(r,q.value)&&(!method.value||r['测评方式']===method.value)&&(!discipline.value||r['学科']===discipline.value));
